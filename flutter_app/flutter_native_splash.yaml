# Écran de démarrage natif Chap.ci
#
# À poser à la racine du projet Flutter, après avoir copié le contenu de
# fichiers/flutter/splash/ dans assets/marque/splash/.
#
#   flutter pub add dev:flutter_native_splash
#   dart run flutter_native_splash:create
#
# Régénérer après chaque changement de logo : le paquet recopie les images
# dans les dossiers natifs, il ne les lit pas au démarrage.

flutter_native_splash:
  # Clair : champ orange, signe encre — la combinaison de l'icône
  # d'application, mesurée à 6,62:1.
  color: '#F77F00'
  image: assets/marque/splash/chapci_splash.png
  branding: assets/marque/splash/chapci_branding.png

  # Sombre : l'inverse, même rapport de contraste.
  color_dark: '#1B1A17'
  image_dark: assets/marque/splash/chapci_splash_sombre.png
  branding_dark: assets/marque/splash/chapci_branding_sombre.png

  branding_mode: bottom
  branding_bottom_padding: 48

  # Android 12 et au-delà passent par l'API de splash du système : l'icône y
  # est rognée au cercle central, soit les deux tiers du cadre. Les fichiers
  # ci-dessous font 1152 px avec le signe inscrit dans le cercle de 768 px,
  # comme le demande le paquet.
  android_12:
    color: '#F77F00'
    image: assets/marque/splash/chapci_android12.png
    branding: assets/marque/splash/chapci_branding.png

    color_dark: '#1B1A17'
    image_dark: assets/marque/splash/chapci_android12_sombre.png
    branding_dark: assets/marque/splash/chapci_branding_sombre.png

  # Le splash natif ne doit pas masquer la barre d'état : l'utilisateur perd
  # l'heure et le réseau pendant le lancement, et la transition vers l'appli
  # devient un saut.
  fullscreen: false

  android: true
  ios: true
  web: false
