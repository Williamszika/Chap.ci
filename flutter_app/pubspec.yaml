name: chapci
description: "Chap.ci — petites annonces en Côte d'Ivoire (application Flutter)."
publish_to: "none"

# La version affichée + le versionCode Android (après le +).
# ⚠️ Le nombre après le + DOIT être supérieur au dernier versionCode téléversé
#    sur le Play Store. Dernier téléversé : 22 (v1.21, envoyée à l'examen le
#    26/08). La v1.22 (code 23) a été construite le 27/08 mais JAMAIS téléversée.
#    Six commits de code Flutter sont venus depuis — vitrine du professionnel,
#    compte entier dans le tableau de bord, cibles tactiles : ce n'est plus la
#    v1.22 qu'on construirait. Donc 24, la v1.23.
version: 1.23.0+24

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Localisation des widgets natifs (dates, sélecteurs) et bascule automatique
  # en droite-à-gauche pour l'arabe. Nos propres textes sont dans lib/i18n/.
  flutter_localizations:
    sdk: flutter
  # Réseau : appels à l'API PHP existante (https://chap.ci/api).
  http: ^1.2.2
  # Stockage local du jeton de session (l'équivalent du cookie du site).
  shared_preferences: ^2.3.2
  # Choisir des photos (galerie / appareil photo) pour publier une annonce.
  image_picker: ^1.1.2
  cupertino_icons: ^1.0.8
  geolocator: ^14.0.3
  qr_flutter: ^4.1.0
  share_plus: ^13.3.0
  # Ouvrir le lien « En savoir plus » d'une publicité (navigateur / lien externe).
  url_launcher: ^6.3.0
  # Pages d'info et légales (aide, FAQ, CGU…) affichées DANS l'app, en vue web
  # embarquée : le contenu reste servi par chap.ci (source unique), mais
  # l'utilisateur ne part jamais dans un navigateur séparé.
  webview_flutter: ^4.7.0
  google_sign_in: ^6.2.1
  # Flux OAuth par le navigateur système (Facebook — code prêt, bouton en
  # « bientôt »). La 3.x utilisait l'ancienne API Android « Registrar »,
  # supprimée par les Flutter récents : elle a cassé le build de la v1.21 le
  # 26/08/2026. La 5.x garde la même signature `authenticate(url:,
  # callbackUrlScheme:)` et le même CallbackActivity/schéma `chapci` que pose
  # tool/preparer_plateformes.dart — rien d'autre à changer.
  flutter_web_auth_2: ^5.1.0
  # Glisser une conversation à gauche/droite pour révéler des actions
  # (épingler, archiver, bloquer, supprimer).
  flutter_slidable: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Génère l'icône de lancement Android à partir du logo Chap.ci.
  flutter_launcher_icons: ^0.14.1
  # Écran de démarrage natif (champ orange, signe « chap-chap », variantes
  # sombres et Android 12+) — configuré par flutter_native_splash.yaml, copié
  # dans android/ et ios/ par `dart run flutter_native_splash:create`, que
  # tool/preparer_plateformes.dart relance après chaque régénération.
  flutter_native_splash: ^2.4.4

# Icône de lancement — lancée par `tool/preparer_android.dart` (ou
# `dart run flutter_launcher_icons`) après la génération du dossier android/.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 22
  # Le crème du site — même sol pour l'icône, l'écran de démarrage et les
  # pages. Ce n'est plus l'orange : la marque est passée au vert le 30/08/2026,
  # et c'est la COURONNE qui porte la couleur, pas le fond.
  adaptive_icon_background: "#FFFDF9"
  adaptive_icon_foreground: "assets/icon/icon_maskable.png"
  # iOS refuse toute transparence dans l'icône : on part du logo plein cadre
  # (sans canal alpha) et on aplatit ce qui resterait sur le crème.
  image_path_ios: "assets/icon/icon_maskable.png"
  remove_alpha_ios: true
  background_color_ios: "#FFFDF9"

flutter:
  uses-material-design: true

  # Le signe de marque, à trois densités. Flutter va chercher tout seul les
  # variantes `2.0x/` et `3.0x/` : elles n'ont pas à être déclarées.
  #
  # `assets/icon/` et `assets/marque/splash/` ne sont VOLONTAIREMENT pas ici :
  # ces images-là sont consommées à la construction (flutter_launcher_icons et
  # flutter_native_splash les recopient dans android/ et ios/). Les embarquer
  # en plus alourdirait l'APK d'un quart de méga sans que rien ne les lise.
  assets:
    - assets/marque/
