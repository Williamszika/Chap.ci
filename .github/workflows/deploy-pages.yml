name: Déploiement GitHub Pages

# Construit l'application et la publie sur GitHub Pages à chaque push.
# URL de test : https://williamszika.github.io/Chap.ci/

on:
  push:
    branches:
      - claude/ci-marketplace-mobile-app-bnllro
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le site
        run: npm run build
        env:
          # Chemin de base = nom du dépôt (site de projet GitHub Pages)
          VITE_BASE: /Chap.ci/
          # Variables Supabase : définies dans Settings > Secrets and variables
          # > Actions > Variables (sinon, valeurs par défaut du code utilisées).
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Repli SPA (404 -> index)
        run: cp dist/index.html dist/404.html

      # ⚠️ Prérequis (à faire UNE fois) : dans GitHub, Settings > Pages >
      # « Build and deployment » > Source : « GitHub Actions ».
      - name: Téléverser l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
